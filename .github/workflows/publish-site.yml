name: Publish sito (Quarto)

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Dipendenze di sistema per i pacchetti R (units/epikit/sf)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-0 libudunits2-dev \
            libproj-dev libgdal-dev libgeos-dev \
            libsqlite3-dev libnetcdf-dev \
            libxml2-dev libcurl4-openssl-dev libssl-dev

      - name: Versioni (debug)
        run: |
          R --version | head -1
          quarto --version

      - name: Installa i pacchetti R del corso (binari P3M)
        run: |
          DISTRO=$(lsb_release -cs)
          export R_REPOS="https://packagemanager.posit.co/cran/__linux__/${DISTRO}/latest"
          echo "CRAN mirror: ${R_REPOS}"
          Rscript -e "options(repos = c(CRAN = Sys.getenv('R_REPOS'))); install.packages('pacman'); source('prog_stat_mepi/pacchetti_da_istallare.R')"

      - name: Render del sito con Quarto
        run: quarto render

      - name: Copia il sito renderizzato nella root del repo
        run: rsync -a --exclude '.git' --exclude '_site' --exclude '.quarto' _site/ ./

      - name: Commit e push del sito (salta il re-trigger della CI)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site [skip ci]" || echo "Nessuna modifica da committare"
          git push
